<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>H5P Playback Test | Literacy Teacher</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:30px auto;padding:0 18px;color:#251b30}header{background:#2b0f46;color:white;padding:24px;border-radius:12px}h1{margin:0 0 8px}.notice{background:#f4eff9;padding:15px;margin:20px 0;border-radius:8px}h5p-player{display:block;min-height:420px}#status{white-space:pre-wrap;background:#f7f7f7;border:1px solid #ddd;padding:15px;line-height:1.6;overflow-wrap:anywhere}a{color:#52248a}
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@missing-elements/h5p-offline-player@1.5.1/dist/h5p-player.js"></script>
</head>
<body>
<header><h1>Original H5P Playback Test</h1><div>Instructor-only test; no grades submitted</div></header>
<div class="notice">This is a separate playback test. Your student course and Google Sheets reporting are unchanged.</div>
<pre id="status">Waiting for player…</pre>
<h5p-player id="player" libraries="pack" pack-base="https://natalie-beach.github.io/literacy-teacher-simulation/h5p-libraries/parts/" sw="https://natalie-beach.github.io/literacy-teacher-simulation/h5p-sw.js" assets-base="https://cdn.jsdelivr.net/npm/@missing-elements/h5p-runtime@1.0.1/dist/"></h5p-player>
<p><a href="../index.html">Back to current simulation</a></p>
<script>
const p=document.getElementById('player'),status=document.getElementById('status');
const lines=[];function log(label,value){lines.push(label+': '+(typeof value==='string'?value:JSON.stringify(value)));status.textContent=lines.join('\n');}
const base='https://natalie-beach.github.io/literacy-teacher-simulation/';
for(const name of ['statechange','progress','ready','error','load'])p.addEventListener(name,e=>log('Player '+name,e.detail||e.type));
window.addEventListener('error',e=>log('Page error',e.message));
window.addEventListener('unhandledrejection',e=>log('Unhandled rejection',String(e.reason)));
(async()=>{
log('Configured pack-base',p.getAttribute('pack-base'));
for(const path of ['original-scenario.h5p','h5p-libraries/parts/index.json','h5p-libraries/parts/H5P.BranchingScenario-1.11.h5p']){
try{const r=await fetch(base+path,{method:'HEAD',cache:'no-store'});log(path,r.status+' '+r.statusText);}catch(e){log(path,e.message)}
}
try{await customElements.whenDefined('h5p-player');log('Player component','defined');p.setAttribute('src',base+'original-scenario.h5p');log('Source set',p.getAttribute('src'));}catch(e){log('Player setup error',e.message)}
setTimeout(()=>{log('Player state after 12s',p.state||'unknown');log('Worker scope',p.scope||'unknown');log('Iframe present',!!p.shadowRoot?.querySelector('iframe'));},12000);
})();
</script>
</body></html>
