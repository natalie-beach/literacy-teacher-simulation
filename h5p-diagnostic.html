<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H5P Diagnostic</title><style>body{font:16px Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 18px;color:#271738}h1{color:#2b0f46}.line{padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:7px;overflow-wrap:anywhere}.ok{background:#effaf1}.bad{background:#fff1f1}.wait{background:#f7f3fb}button{padding:12px 18px;background:#2b0f46;color:white;border:0;border-radius:6px;cursor:pointer}code{font-size:13px}h5p-player{display:block;min-height:350px;border:1px dashed #ccc;margin:15px 0}</style><script type="module" src="https://cdn.jsdelivr.net/npm/@missing-elements/h5p-offline-player@1.5.1/dist/h5p-player.js"></script></head><body><h1>H5P Playback Diagnostic</h1><p>This test does not change the course or submit grades. It checks file availability and whether the H5P player initializes.</p><div id="results"></div><button onclick="location.reload()">Run checks again</button><h2>Player area</h2><h5p-player id="player" src="./original-scenario.h5p" libraries="pack" pack-base="./h5p-libraries/" sw="./h5p-sw.js" assets-base="https://cdn.jsdelivr.net/npm/@missing-elements/h5p-runtime@1.0.1/dist/"></h5p-player><script>
const box=document.getElementById('results');function line(label,detail,state='wait'){let e=document.createElement('div');e.className='line '+state;e.textContent=label+': '+detail;box.appendChild(e)}
async function check(path){try{const r=await fetch(path,{cache:'no-store'});line(path,`${r.status} ${r.ok?'AVAILABLE':'NOT FOUND'} (${r.headers.get('content-type')||'unknown type'})`,r.ok?'ok':'bad');return r.ok}catch(e){line(path,e.message,'bad');return false}}
(async()=>{await Promise.all(['./h5p-libraries/index.json','./original-scenario.h5p','./h5p-sw.js','./h5p-libraries/parts/H5P.BranchingScenario-1.11.h5p'].map(check));if(!('serviceWorker' in navigator))line('Service worker','Not supported','bad');else{const reg=await navigator.serviceWorker.getRegistration().catch(()=>null);line('Service worker registration',reg?`scope ${reg.scope}; active ${!!reg.active}`:'None found',reg?'ok':'bad');line('Service worker controller',navigator.serviceWorker.controller?.scriptURL||'Not controlling this page',navigator.serviceWorker.controller?'ok':'bad')}setTimeout(()=>{let p=document.getElementById('player');line('H5P custom element',customElements.get('h5p-player')?'Loaded':'NOT loaded',customElements.get('h5p-player')?'ok':'bad');line('Player contents',`${p.children.length} child elements; shadow root ${p.shadowRoot?'present':'absent'}`);line('Next step','If everything above is green but the player is blank, take a screenshot of this page and Chrome Network tab filtered to Failed requests.')},4500)})();
window.addEventListener('error',e=>line('JavaScript error',e.message,'bad'));window.addEventListener('unhandledrejection',e=>line('Unhandled error',String(e.reason),'bad'));
</script></body></html>
