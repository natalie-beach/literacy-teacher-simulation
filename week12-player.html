<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 12 H5P</title><script type="module" src="https://cdn.jsdelivr.net/npm/@missing-elements/h5p-offline-player@1.5.1/dist/h5p-player.js"></script><style>body{font-family:Arial,sans-serif;margin:12px}h5p-player{display:block;min-height:480px}#error{color:#842029;background:#f8d7da;padding:12px;display:none}</style></head><body><div id="error" role="alert"></div><h5p-player id="player" libraries="pack" pack-base="./h5p-libraries/" sw="./h5p-sw.js" assets-base="https://cdn.jsdelivr.net/npm/@missing-elements/h5p-runtime@1.0.1/dist/"></h5p-player><script>const p=Number(new URLSearchParams(location.search).get('part'));const error=document.getElementById('error');function fail(t){error.style.display='block';error.textContent=t}if(!Number.isInteger(p)||p<1||p>4)fail('Invalid part number.');else{const path='./week-12/segment-'+p+'.h5p';document.getElementById('player').setAttribute('src',path);fetch(path).then(r=>{if(!r.ok)fail('Segment not found: '+path+' (HTTP '+r.status+')')}).catch(e=>fail('Segment request failed: '+e.message));setTimeout(()=>{if(!customElements.get('h5p-player'))fail('H5P player JavaScript did not load.');},7000)}</script></body></html>
